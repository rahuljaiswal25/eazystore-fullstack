spring.application.name=eazystore
#debug=true

logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
logging.level.root=${LOG_LEVEL:INFO}
logging.file.name=logs/app.log
logging.pattern.file={"timestamp":"%d{yyyy-MM-dd HH:mm:ss}","level":"%p","logger":"%c","message":"%m"}

spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3307}/${DATABASE_NAME:eazystore}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.jpa.show-sql=${JPA_SHOW_URL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

managemeant.endpoint.health.show-details=always
managemeant.endpoints.web.base-path=/eazystore/actuator
managemeant.endpoints.web.exposure.include=*
managemeant.endpoint.configprops.show-values=always
managemeant.endpoint.env.show-values=always

management.info.env.enabled=true
info.app.name=eazystore
info.app.description=Backend Project for Eazy Store E-Commerce application
inof.app.version=1.0.0
info.app.contact.email=rahul@gmail.com

contact.phone=+91-1234567890
contact.email=rahul1@gmail.com
contact.address=Bhubaneswar, Odisha

eazystore.cors.allowed-origins=http://localhost:5173